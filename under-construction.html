<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bereket Kinfe – Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --gold: #c9a84c;
        --gold-lt: #e8d08a;
        --white: #ffffff;
        --glass-bg: rgba(10, 14, 20, 0.52);
        --glass-border: rgba(201, 168, 76, 0.25);
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      /* ── Full-bleed background ── */
      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
        color: var(--white);
      }

      .bg-image {
        position: fixed;
        inset: 0;
        background: url("./assets/tech-bg.png") center center / cover no-repeat;
        z-index: 0;
      }

      /* Dual gradient overlay: dark vignette + warm tint at bottom */
      .bg-image::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at center,
            rgba(0, 0, 0, 0.25) 0%,
            rgba(0, 0, 0, 0.7) 100%
          ),
          linear-gradient(to top, rgba(10, 7, 3, 0.7) 0%, transparent 55%);
      }

      /* ── Ambient particles ── */
      .particles {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }
      .particles span {
        position: absolute;
        bottom: -20px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(201, 168, 76, 0.45);
        animation: rise var(--dur, 14s) linear infinite;
        animation-delay: var(--delay, 0s);
        left: var(--x, 50%);
      }
      @keyframes rise {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 0.6;
        }
        100% {
          transform: translateY(-105vh) scale(0.4);
          opacity: 0;
        }
      }

      /* ── Card ── */
      .card {
        position: relative;
        z-index: 2;
        width: min(480px, 92vw);
        padding: 48px 44px 40px;
        border-radius: 24px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        box-shadow:
          0 0 0 1px rgba(201, 168, 76, 0.08),
          0 32px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        text-align: center;
        animation: fadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Logo ── */
      .logo-wrap {
        margin-bottom: 28px;
      }
      .logo-wrap img {
        height: 82px;
        width: auto;
        border-radius: 50%;
        object-fit: contain;
        filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.5));
        animation: fadeUp 1.6s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* ── Gold rule ── */
      .gold-rule {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 auto 28px;
        max-width: 260px;
      }
      .gold-rule::before,
      .gold-rule::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, transparent, var(--gold));
      }
      .gold-rule::after {
        background: linear-gradient(to left, transparent, var(--gold));
      }
      .gold-rule span {
        color: var(--gold);
        font-size: 0.65rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* ── Heading ── */
      h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2rem, 5.5vw, 2.6rem);
        font-weight: 300;
        letter-spacing: 0.06em;
        line-height: 1.2;
        background: linear-gradient(
          135deg,
          var(--white) 30%,
          var(--gold-lt) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
      }

      .tagline {
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 26px;
        opacity: 0.9;
      }

      /* ── Status badge ── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 18px;
        border-radius: 100px;
        background: rgba(201, 168, 76, 0.12);
        border: 1px solid rgba(201, 168, 76, 0.3);
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold-lt);
        margin-bottom: 24px;
      }
      .badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 8px var(--gold);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.75);
        }
      }

      /* ── Body text ── */
      .body-text {
        font-size: 0.92rem;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.75;
        max-width: 340px;
        margin: 0 auto 32px;
      }

      /* ── Spinner ── */
      .spinner-wrap {
        margin: 0 auto 28px;
        width: 44px;
        height: 44px;
        position: relative;
      }
      .spinner-wrap::before,
      .spinner-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }
      .spinner-wrap::before {
        border: 1.5px solid rgba(201, 168, 76, 0.15);
      }
      .spinner-wrap::after {
        border: 1.5px solid transparent;
        border-top-color: var(--gold);
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Footer ── */
      .card-footer {
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.28);
      }
      .card-footer a {
        color: rgba(201, 168, 76, 0.55);
        text-decoration: none;
        transition: color 0.3s;
      }
      .card-footer a:hover {
        color: var(--gold-lt);
      }

      @media (max-width: 768px) {
        .card {
          padding: 32px 24px 28px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Full-bleed background -->
    <div class="bg-image"></div>

    <!-- Ambient golden particles -->
    <div class="particles" aria-hidden="true">
      <span style="--x: 8%; --dur: 16s; --delay: 0s"></span>
      <span style="--x: 18%; --dur: 13s; --delay: 2.5s"></span>
      <span style="--x: 32%; --dur: 18s; --delay: 5s"></span>
      <span style="--x: 45%; --dur: 14s; --delay: 1.2s"></span>
      <span style="--x: 58%; --dur: 19s; --delay: 3.8s"></span>
      <span style="--x: 70%; --dur: 12s; --delay: 6s"></span>
      <span style="--x: 82%; --dur: 17s; --delay: 0.8s"></span>
      <span style="--x: 93%; --dur: 15s; --delay: 4.4s"></span>
    </div>

    <!-- Main card -->
    <main class="card" role="main">
      <!-- Logo -->
      <div class="logo-wrap">
        <img src="./assets/avatar.png" alt="Trails Of Ethiopia Logo" />
      </div>

      <!-- Gold divider -->
      <div class="gold-rule"><span>Eth. Dev</span></div>

      <h1>Bereket Kinfe</h1>
      <p class="tagline">Plan &nbsp;·&nbsp; Build &nbsp;·&nbsp; Ship</p>

      <!-- Status -->
      <div class="badge">
        <span class="badge-dot"></span>
        Under Maintenance
      </div>

      <p class="body-text">
        My site is being updated, please check back shortly.
      </p>

      <!-- Spinner -->
      <div class="spinner-wrap" aria-label="Loading"></div>

      <!-- Footer -->
      <div class="card-footer">
        <a href="https://bereketkinfe.pro.et" target="_blank" rel="noopener"
          >bereketkinfe.pro.et</a
        >
      </div>
    </main>
  </body>
</html>
